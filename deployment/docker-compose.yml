version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: enat_milk_shop_app
    restart: unless-stopped
    environment:
      APP_NAME: "Enat Milk Shop"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: enat_milk_shop
      DB_USERNAME: enat_user
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage
      - media_data:/var/www/html/public/uploads
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: enat_milk_shop_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: enat_milk_shop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: enat_milk_shop
      MYSQL_USER: enat_user
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: enat_milk_shop_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  storage_data:
  media_data:
